[package]
name = "dbx-rdp-sidecar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace]

[dependencies]
dbx-plugin-sdk = { version = "0.1.0" }
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "850839f4756f4efb486a47abb89a93b3b4694a40", default-features = false, features = [
    "core",
    "connector",
    "cliprdr",
    "input",
    "pdu",
    "session",
    "client",
    "client-clipboard",
    "rustls",
] }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP", rev = "850839f4756f4efb486a47abb89a93b3b4694a40", features = ["rustls"] }
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
